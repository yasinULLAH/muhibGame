name: Build Standalone APK and Portable EXE

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Prepare Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp -r audio android/app/src/main/assets/ || true
          cp -r img android/app/src/main/assets/ || true
          cp favicon.ico logo.png manifest.json version.json android/app/src/main/assets/ || true
          cp icon-*.png android/app/src/main/assets/ || true

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Flappy-Muhib.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Muhib-Android-APK
          path: Flappy-Muhib.apk
          if-no-files-found: error

  build-exe:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows Portable EXE
        run: npm run dist:win

      - name: Upload Windows Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flappy-Muhib-Windows-Portable-EXE
          path: dist-electron/Flappy-Muhib-Portable.exe
          if-no-files-found: error

  publish-release:
    name: Publish Release Assets
    needs: [build-apk, build-exe]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Flappy-Muhib-Android-APK
          path: release-artifacts

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: Flappy-Muhib-Windows-Portable-EXE
          path: release-artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "Flappy Muhib — Latest Build"
          make_latest: "true"
          body: |
            Automated standalone and offline builds generated by GitHub Actions:

            - **Flappy-Muhib.apk**: Standalone Android APK (fullscreen, 100% offline).
            - **Flappy-Muhib-Portable.exe**: Standalone portable Windows executable (fullscreen, 100% offline).
          files: |
            release-artifacts/Flappy-Muhib.apk
            release-artifacts/Flappy-Muhib-Portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
